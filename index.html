  <title>(m)ein Fundstückprotokoll</title>

  <style>
    /* RESET */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 20px;
    }

    body {
      background: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* TITEL */
    header {
      padding: 40px 20px;
      text-align: relative;
    }

    header h1 {
      font-size: 32px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    header p {
      font-size: 14px;
      opacity: 0.8;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      column-gap: 8px;
 	  row-gap: 20px;

    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .item {
      position: relative;
      cursor: pointer;
    }

    .item img {
      width: 100%;
      display: block;
      transition: opacity 0.3s ease;
    }

    .item img.hover {
	  position: absolute;
  	  top: 0;
 	  left: 0;
      opacity: 0;
    }

    .item:hover img.hover {
      opacity: 1;
    }

    /* LIGHTBOX */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      cursor: pointer;
    }

    .arrow {
      position: absolute;
      top: 50%;
      font-size: 60px;
      cursor: pointer;
      user-select: none;
    }

    .arrow.left {
      left: 30px;
    }

    .arrow.right {
      right: 30px;
    }

	  /* UNTERER BEREICH */
.bottom {
  margin-top: 120px;
  display: flex;
  gap: 40px;
	align-items: center;
}

.bottom img {
  width: 50%;
  object-fit: cover;
}

.textbox {
  width: 50%;
  font-size: 14px;
  line-height: 1.6;
}

  </style>

  <!-- JAVASCRIPT -->
  <script>
    let images = [];
    let current = 0;

    function openLightbox(img1, img2) {
      images = [img1, img2];
      current = 0;
      document.getElementById("lightbox-img").src = images[current];
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox(e) {
      if (e.target.id === "lightbox" || e.target.classList.contains("close")) {
        document.getElementById("lightbox").classList.remove("active");
      }
    }

    function nextImage(e) {
      e.stopPropagation();
      current = (current + 1) % images.length;
      document.getElementById("lightbox-img").src = images[current];
    }

    function prevImage(e) {
      e.stopPropagation();
      current = (current - 1 + images.length) % images.length;
      document.getElementById("lightbox-img").src = images[current];
    }
  </script>
