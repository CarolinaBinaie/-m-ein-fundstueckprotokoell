<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>(m)ein Fundstückprotokoll</title>

  <style>
    /* RESET */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* TITEL */
    header {
      padding: 40px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    header p {
      font-size: 14px;
      opacity: 0.8;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 20px;
    }

    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .item {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
    }

    .item img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      transition: opacity 0.3s ease;
    }

    .item img.hover {
      opacity: 0;
    }

    .item:hover img.hover {
      opacity: 1;
    }

    /* LIGHTBOX */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 90%;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      cursor: pointer;
    }

    .arrow {
      position: absolute;
      top: 50%;
      font-size: 60px;
      cursor: pointer;
      user-select: none;
    }

    .arrow.left {
      left: 30px;
    }

    .arrow.right {
      right: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>(m)ein Fundstückprotokoll</h1>
    <p>eine Arbeit von Carolina Binaie Masouleh</p>
  </header>

  <main class="grid">
    <!-- BEISPIEL: du kopierst diesen Block für alle Bilder -->
    <div class="item" onclick="openLightbox('bilder/img1.jpg','bilder/img1_hover.jpg')">
      <img src="bilder/img1.jpg">
      <img src="bilder/img1_hover.jpg" class="hover">
    </div>

    <div class="item" onclick="openLightbox('bilder/img2.jpg','bilder/img2_hover.jpg')">
      <img src="bilder/img2.jpg">
      <img src="bilder/img2_hover.jpg" class="hover">
    </div>

    <div class="item" onclick="openLightbox('bilder/img3.jpg','bilder/img3_hover.jpg')">
      <img src="bilder/img3.jpg">
      <img src="bilder/img3_hover.jpg" class="hover">
    </div>
  </main>

  <!-- LIGHTBOX -->
  <div id="lightbox" onclick="closeLightbox(event)">
    <span class="close">×</span>
    <span class="arrow left" onclick="prevImage(event)">‹</span>
    <img id="lightbox-img">
    <span class="arrow right" onclick="nextImage(event)">›</span>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    let images = [];
    let current = 0;

    function openLightbox(img1, img2) {
      images = [img1, img2];
      current = 0;
      document.getElementById("lightbox-img").src = images[current];
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox(e) {
      if (e.target.id === "lightbox" || e.target.classList.contains("close")) {
        document.getElementById("lightbox").classList.remove("active");
      }
    }

    function nextImage(e) {
      e.stopPropagation();
      current = (current + 1) % images.length;
      document.getElementById("lightbox-img").src = images[current];
    }

    function prevImage(e) {
      e.stopPropagation();
      current = (current - 1 + images.length) % images.length;
      document.getElementById("lightbox-img").src = images[current];
    }
  </script>

</body>
</html>
