<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Meine Bilder</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .bild {
      cursor: pointer;
    }

    .bild img {
      width: 100%;
      transition: transform 0.3s;
    }

    .bild img:hover {
      transform: scale(1.05);
    }

    /* Popup */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .overlay img {
      max-width: 90%;
      max-height: 90%;
    }

    .overlay.active {
      display: flex;
    }
  </style>
</head>

<body>

<h1>Meine Bildergalerie</h1>

<div class="grid">
  <div class="bild" onclick="openImg('bilder/bild1.jpg')">
    <img src="bilder/bild1.jpg">
  </div>

  <div class="bild" onclick="openImg('bilder/bild2.jpg')">
    <img src="bilder/bild2.jpg">
  </div>

  <div class="bild" onclick="openImg('bilder/bild3.jpg')">
    <img src="bilder/bild3.jpg">
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeImg()">
  <img id="gross">
</div>

<script>
  function openImg(src) {
    document.getElementById("gross").src = src;
    document.getElementById("overlay").classList.add("active");
  }

  function closeImg() {
    document.getElementById("overlay").classList.remove("active");
  }
</script>

</body>
</html>
